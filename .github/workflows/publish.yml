name: Publish
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  publish:
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          registry-url: https://registry.npmjs.org/

      - name: npm install
        run: npm ci
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}

      - name: Publish
        run: npm publish --registry=https://registry.npmjs.org/
